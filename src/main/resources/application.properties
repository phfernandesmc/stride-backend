# ============================================================
#  Aplicação
# ============================================================
spring.application.name=stride-api
server.port=8080

# Java 25 + Boot 4: cada request HTTP roda numa virtual thread.
# A partir do Java 24 o pinning em bloco synchronized deixou de
# existir, então JDBC/Hikari não seguram mais a carrier thread.
spring.threads.virtual.enabled=true

# ============================================================
#  Banco de dados
# ============================================================
# Em DESENVOLVIMENTO não defina spring.datasource.url/username/password.
# O spring-boot-docker-compose sobe o compose.yaml e publica um bean
# JdbcConnectionDetails, que tem PRECEDÊNCIA sobre estas propriedades:
# se você preencher aqui, o valor é ignorado em silêncio no dev.
#
# Em PRODUÇÃO (sem docker-compose) injete por variável de ambiente:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://host:5432/stride_db
#   SPRING_DATASOURCE_USERNAME=...
#   SPRING_DATASOURCE_PASSWORD=...

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# ============================================================
#  Flyway
# ============================================================
# O padrão é FALSE: um arquivo com nome fora da convenção (ex.: "_"
# no lugar de "__") seria ignorado em silêncio, e a aplicação subiria
# com o banco vazio. Com true, falha na hora e você vê o erro.
spring.flyway.validate-migration-naming=true

# Padrões que valem conhecer (não precisa redefinir):
#   spring.flyway.locations=classpath:db/migration
#   spring.flyway.clean-disabled=true

# ============================================================
#  JSON
# ============================================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=true

# ============================================================
#  Respostas de erro (RFC 9457 - ProblemDetail)
# ============================================================
spring.mvc.problemdetails.enabled=true

# ATENÇÃO: no Boot 4 estas propriedades saíram de server.error.*
# e viraram spring.web.error.*. A forma antiga está DEPRECATED.
# include-message=always ajuda no desenvolvimento, mas expõe mensagens
# de exceção: em produção troque para "never".
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-stacktrace=never

# ============================================================
#  Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ============================================================
#  OpenAPI / Swagger
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================================
#  Segurança / JWT  (escolher UMA abordagem ao implementar)
# ============================================================
# Você tem users.password_hash + Argon2 (bouncycastle), ou seja, a
# própria API emite os tokens. NÃO use issuer-uri/jwk-set-uri: essas
# são para IdP externo (Keycloak, Auth0) e o Boot tenta buscar os
# metadados no startup, falhando se a URL não responder.
#
# Opção A - par de chaves RSA (recomendado: permite rotação e expor
# um JWKS depois). Exige também um bean JwtEncoder com a chave privada.
#spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:jwt/public.pem
#
# Opção B - segredo simétrico (HMAC). Não tem propriedade: exige um
# bean JwtDecoder feito com NimbusJwtDecoder.withSecretKey(...).

# ============================================================
#  CORS
# ============================================================
# Origens do frontend autorizadas a chamar a API pelo navegador.
# Ajuste conforme o framework escolhido para o stride-frontend:
#   Vite/React, Vue    -> 5173
#   Next.js, CRA       -> 3000
#   Angular            -> 4200
# Deixe apenas as que voce realmente usa.
stride.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ============================================================
#  JWT
# ============================================================
# "iss" do token: identifica quem emitiu. O decoder rejeita
# tokens com issuer diferente deste valor.
# Precisa ser uma URL: o Jwt.getIssuer() do Spring devolve java.net.URL
# e estoura com um texto solto. Em producao, a URL publica da API.
stride.jwt.issuer=http://localhost:8080

# Validade do access token. Curto de proposito: se vazar, a
# janela de uso e pequena. Renovacao fica para o refresh token.
stride.jwt.access-token-ttl=15m

# Chaves de DESENVOLVIMENTO, geradas localmente.
# NUNCA use estas em producao: aponte para um segredo montado no
# ambiente, por exemplo STRIDE_JWT_PRIVATE_KEY=file:/run/secrets/jwt.pem
stride.jwt.private-key=classpath:jwt/private.pem
stride.jwt.public-key=classpath:jwt/public.pem

# ============================================================
#  Logging
# ============================================================
logging.level.org.flywaydb=INFO
# Descomente para ver o SQL emitido pelo JdbcClient/JdbcTemplate:
#logging.level.org.springframework.jdbc.core=DEBUG
